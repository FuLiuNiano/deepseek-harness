# Build the customized Desktop app and publish one GitHub Release per build.
# The build is unsigned until a Windows signing certificate is supplied.
name: Desktop release (GitHub)

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: com.deepseek.harness.desktop
  DSH_DESKTOP_UPDATE_PROVIDER: github
  DSH_DESKTOP_GITHUB_OWNER: ${{ github.repository_owner }}
  DSH_DESKTOP_GITHUB_REPO: ${{ github.event.repository.name }}

jobs:
  release:
    name: Windows x64 Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether this version already has a Release
        id: release-check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $baseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ([string]::IsNullOrWhiteSpace($baseVersion)) { throw 'package.json has no version' }
          $runNumber = [int]$env:GITHUB_RUN_NUMBER

          function Test-GitHubRelease([string]$releaseTag) {
            gh release view $releaseTag --repo $env:GITHUB_REPOSITORY *> $null
            $found = $LASTEXITCODE -eq 0
            # A missing release is the expected first-publish case. Clear the
            # native command exit code before the next PowerShell statement.
            $global:LASTEXITCODE = 0
            return $found
          }

          # The upstream project may change source code without changing its
          # package version. Give every such build a valid, increasing SemVer
          # so electron-updater can see it as a new release.
          $version = $baseVersion
          $tag = "v$version"
          if (Test-GitHubRelease $tag) {
            if ($baseVersion.Contains('-')) {
              $version = "$baseVersion.build.$runNumber"
            } else {
              $parts = $baseVersion.Split('.')
              if ($parts.Count -ne 3) { throw "Unsupported base version: $baseVersion" }
              $nextPatch = ([int]$parts[2]) + 1
              $version = "$($parts[0]).$($parts[1]).$nextPatch-build.$runNumber"
            }
            $tag = "v$version"
          }
          $exists = Test-GitHubRelease $tag
          $shouldRelease = if ($exists) { 'false' } else { 'true' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
          if ($exists) { Write-Host "Release $tag already exists; skipping this commit." }

      - name: Set unique build version
        if: steps.release-check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release-check.outputs.version }}'
          foreach ($path in @('package.json', 'apps/desktop/package.json')) {
            $package = Get-Content -LiteralPath $path -Raw | ConvertFrom-Json
            $package.version = $version
            $json = $package | ConvertTo-Json -Depth 100
            [System.IO.File]::WriteAllText(
              [string](Resolve-Path -LiteralPath $path),
              "$json`n",
              [System.Text.UTF8Encoding]::new($false)
            )
          }

      - uses: pnpm/action-setup@v4
        if: steps.release-check.outputs.should_release == 'true'
        with:
          version: 11.7.0

      - uses: actions/setup-node@v6
        if: steps.release-check.outputs.should_release == 'true'
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.release-check.outputs.should_release == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build unsigned Windows installer
        if: steps.release-check.outputs.should_release == 'true'
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Verify updater files
        if: steps.release-check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release-check.outputs.version }}'
          $root = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $installer = Join-Path $root "deepseek-harness-$version-win-x64.exe"
          if (!(Test-Path -LiteralPath $installer)) { throw "Missing installer: $installer" }
          # GitHub Releases uses latest.yml even when the package version is a
          # prerelease. Resolve the file from the build output so this check
          # stays aligned with electron-builder's provider-specific naming.
          $metadataCandidates = @(Get-ChildItem -LiteralPath $root -Filter '*.yml' -File |
            Where-Object { $_.Name -notlike 'builder-*.yml' })
          if ($metadataCandidates.Count -eq 0) {
            throw "Missing update metadata in: $root"
          }
          $metadata = ($metadataCandidates |
            Where-Object { $_.Name -eq 'latest.yml' } |
            Select-Object -First 1).FullName
          if ([string]::IsNullOrWhiteSpace($metadata)) {
            $metadata = $metadataCandidates[0].FullName
          }
          Write-Host "Updater metadata: $metadata"
          "installer=$installer" >> $env:GITHUB_OUTPUT
          "metadata=$metadata" >> $env:GITHUB_OUTPUT
        id: artifacts

      - name: Build portable Windows executable
        if: steps.release-check.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.release-check.outputs.version }}'
          $root = 'apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts'
          $portableRoot = 'apps/desktop/.desktop-build/targets/win-x64/portable-artifacts'
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          pnpm exec electron-builder --config apps/desktop/electron-builder.config.mjs --win portable --x64 --publish never --prepackaged (Join-Path $root 'win-unpacked') --config.directories.output $portableRoot --config.artifactName "deepseek-harness-$version-portable.exe"
          $portable = Join-Path $portableRoot "deepseek-harness-$version-portable.exe"
          if (!(Test-Path -LiteralPath $portable)) { throw "Missing portable executable: $portable" }
          "portable=$portable" >> $env:GITHUB_OUTPUT
        id: portable

      - name: Publish GitHub Release
        if: steps.release-check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release-check.outputs.tag }}
          name: DeepSeek Harness ${{ steps.release-check.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.release-check.outputs.version, '-') }}
          files: |
            ${{ steps.artifacts.outputs.installer }}
            ${{ steps.artifacts.outputs.metadata }}
            ${{ steps.portable.outputs.portable }}
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.blockmap
          fail_on_unmatched_files: true
